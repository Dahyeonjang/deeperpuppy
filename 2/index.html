<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>디퍼피 시안 v2 — 뾰족귀</title>
<style>
  html,body{background:#c0c0c0;color:#000}
  body{margin:0;font-family:"Gulim","굴림","Malgun Gothic",sans-serif}
  header{background:#000080;color:#fff;padding:6px 12px;font-size:14px;font-weight:bold;display:flex;justify-content:space-between}
  header span{font-weight:normal}
  .ask{margin:16px 16px 0;padding:10px 12px;background:#ffffe0;border:1px solid #808000;font-size:13px;line-height:1.6}
  .ask a{color:#000080}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px;padding:16px}
  .card{background:#fff;border:2px solid;border-color:#fff #404040 #404040 #fff;box-shadow:1px 1px 0 #000;padding:10px}
  .card h3{margin:0 0 6px;font-size:14px;font-weight:bold}
  .card p{margin:6px 0 0;font-size:12px;color:#333;line-height:1.5}
  svg{width:100%;height:auto;display:block;background:#fff}
  footer{padding:0 16px 24px;font-size:12px;color:#333;line-height:1.6}
</style>
</head>
<body>
<header>디퍼피_시안_v2.bmp - 그림판 <span>2026-09-21</span></header>
<p class="ask">디퍼피 두 번째 후보 — 귀가 뾰족하게 선 강아지 버전입니다. 검은 얼굴, 갈색 몸, 하얀 가슴, 혀 내민 입. 마음에 드는 번호를 골라 주세요. (<a href="../">← 첫 번째 강아지 시안</a>)</p>
<div class="grid" id="grid"></div>
<footer>
  <b>공통 규칙</b> — 검정 3px 선, 페인트통 채우기(선 밖으로 새거나 덜 채워짐), 귀는 위로 선 큰 세모 두 개, 얼굴은 검게, 가슴은 흰 세모, 입은 벌리고 혀. 그림판 기본 팔레트만 쓴다.
</footer>

<script>
let seed = 11;
function rnd(){ seed = (seed*9301+49297)%233280; return seed/233280 - .5; }
function wob(pts, amp=2.4, n=6, close=false){
  const out=[]; const list = close ? [...pts, pts[0]] : pts;
  for(let i=0;i<list.length-1;i++){
    const [x1,y1]=list[i],[x2,y2]=list[i+1];
    for(let k=0;k<n;k++){ const t=k/n; out.push([x1+(x2-x1)*t+rnd()*amp, y1+(y2-y1)*t+rnd()*amp]); }
  }
  out.push(list[list.length-1]);
  return out.map(p=>p.map(v=>v.toFixed(1)).join(',')).join(' ');
}
function circ(cx,cy,r,squash=1,n=14){
  const p=[]; for(let i=0;i<n;i++){const a=i/n*Math.PI*2; p.push([cx+Math.cos(a)*r*(1+rnd()*.12), cy+Math.sin(a)*r*squash*(1+rnd()*.12)]);} return p;
}
const S=(pts,opt={})=>`<polyline points="${wob(pts,opt.amp,opt.n,opt.close)}" fill="${opt.fill||'none'}" stroke="${opt.stroke||'#000'}" stroke-width="${opt.w||3}" stroke-linecap="round" stroke-linejoin="round"/>`;
const F=(pts,color,dx=2,dy=1)=>`<polygon points="${wob(pts.map(([x,y])=>[x+dx,y+dy]),2.5,3,true)}" fill="${color}" stroke="none"/>`;
const dot=(x,y,r=3.2,c="#000")=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${c}"/>`;
const eye=(x,y,r=3.4)=>dot(x,y,r+2.2,"#fff")+dot(x,y,r);           // 검은 얼굴 위 눈: 흰 테 + 검은 점
const svg=(inner,vb="0 0 240 240")=>`<svg viewBox="${vb}" xmlns="http://www.w3.org/2000/svg">${inner}</svg>`;

const BROWN="#c08040", DARK="#404040", WHITE="#fff", PINK="#ff80c0", RED="#ff0000", YEL="#ffff00", BLUE="#0000ff", GRAY="#808080", ORANGE="#ff8000";

// 얼굴 부품: 머리(cx,cy,r) 기준으로 귀·검은 마스크·눈·코·입 한 벌
function face(cx,cy,r,o={}){
  const k=r/50;
  const head=circ(cx,cy,r,0.94);
  const earL=[[cx-30*k,cy-38*k],[cx-52*k,cy-100*k],[cx-4*k,cy-48*k]];
  const earR=[[cx+30*k,cy-38*k],[cx+54*k,cy-98*k],[cx+6*k,cy-48*k]];
  const mask=[[cx-26*k,cy-44*k],[cx+26*k,cy-44*k],[cx+34*k,cy-6*k],[cx+10*k,cy+30*k],[cx-10*k,cy+30*k],[cx-34*k,cy-6*k]];
  const mouth=[[cx-14*k,cy+22*k],[cx+14*k,cy+22*k],[cx+4*k,cy+42*k],[cx-6*k,cy+42*k]];
  const tongue=[[cx-6*k,cy+30*k],[cx+8*k,cy+30*k],[cx+2*k,cy+50*k]];
  return F(earL,o.earFill??DARK,1,2)+S(earL,{close:true})+F(earR,o.earFill??DARK,-2,1)+S(earR,{close:true})+
    F(head,BROWN,3,2)+S(head,{close:true,amp:2.2})+
    F(mask,o.maskFill??DARK,-2,2)+
    eye(cx-17*k,cy-8*k,3.2*k)+eye(cx+17*k,cy-10*k,3.8*k)+
    dot(cx+1*k,cy+12*k,4.2*k)+
    F(mouth,RED,0,0)+S(mouth,{close:true,w:2.5})+
    F(tongue,PINK,0,0)+S(tongue,{close:true,w:2.5});
}

const cards=[];

// 1. 기본형 — 앉은 정면
{
  const body=[[92,132],[148,134],[176,212],[64,214]];
  const chest=[[110,140],[132,140],[121,196]];
  cards.push({t:"① 기본형 — 앉은 정면", d:"큰 귀 두 개가 머리보다 크게 섬. 얼굴은 검게 칠하고 가슴에 흰 세모. 다리는 앞에 막대 두 개.",
  s:svg(
    F(body,BROWN,-3,2)+S(body,{close:true,amp:2})+
    F(chest,WHITE,0,0)+S(chest,{close:true,w:2.5})+
    S([[100,214],[98,232]])+S([[144,214],[146,230]])+
    S([[176,196],[206,176],[214,190]],{amp:2.5})+
    face(120,88,50)
  )});
}

// 2. 얼굴만 — 아이콘용
{
  cards.push({t:"② 얼굴만 — 프로필·아이콘용", d:"귀가 프레임 밖으로 나갈 뻔함. 한쪽 눈이 더 큼. 입은 활짝.",
  s:svg(face(120,140,66))});
}

// 3. 감자형
{
  const blob=[[62,130],[84,84],[130,74],[178,92],[196,146],[168,190],[100,194],[64,166]];
  const earL=[[84,92],[62,30],[118,80]], earR=[[160,86],[192,28],[136,80]];
  const mask=[[96,86],[168,88],[176,130],[142,168],[110,168],[84,130]];
  cards.push({t:"③ 감자형 — 몸통 하나짜리", d:"머리도 몸도 감자 한 덩이. 그 위에 세모 귀 두 개 꽂음. 가슴 흰 세모는 덩이 아래에.",
  s:svg(
    F(earL,DARK)+S(earL,{close:true})+F(earR,DARK,-2,2)+S(earR,{close:true})+
    F(blob,BROWN,4,-2)+S(blob,{close:true,amp:2.2})+
    F(mask,DARK,-2,2)+
    F([[118,170],[146,170],[132,196]],WHITE,0,0)+S([[118,170],[146,170],[132,196]],{close:true,w:2.5})+
    eye(112,120)+eye(150,118,4)+dot(131,140,4.5)+
    F([[118,150],[144,150],[136,166],[126,166]],RED,0,0)+S([[118,150],[144,150],[136,166],[126,166]],{close:true,w:2.5})+
    S([[96,194],[94,220]])+S([[164,192],[166,218]])
  )});
}

// 4. 방석 위 — 사진처럼
{
  const cushion=[[20,196],[220,192],[232,232],[10,234]];
  const body=[[92,128],[148,130],[174,204],[66,206]];
  const chest=[[110,136],[132,136],[121,190]];
  const toy=circ(48,206,16,0.8,10);
  cards.push({t:"④ 방석 위 — 사진 그대로", d:"회색 방석 위에 앉아 있고 옆에 주황색 장난감. 장난감은 그냥 주황 덩어리.",
  s:svg(
    F(cushion,GRAY,2,2)+S(cushion,{close:true,amp:2})+
    F(body,BROWN,-3,2)+S(body,{close:true,amp:2})+
    F(chest,WHITE,0,0)+S(chest,{close:true,w:2.5})+
    S([[100,206],[98,222]])+S([[144,206],[146,220]])+
    F(toy,ORANGE,0,0)+S(toy,{close:true,amp:2.5})+
    face(120,84,48)
  )});
}

// 5. 로고형
{
  const T={w:3.5,amp:2};
  cards.push({t:"⑤ 로고형 — 마우스로 쓴 글씨", d:"왼쪽에 얼굴, 오른쪽에 마우스로 쓴 '디퍼피'. 귀 때문에 얼굴이 위로 붙었음.",
  s:svg(
    face(66,110,38)+
    S([[178,50],[150,52],[150,110],[178,108]],T)+S([[196,48],[196,112]],T)+
    S([[132,130],[176,128]],T)+S([[144,130],[142,158]],T)+S([[166,128],[164,160]],T)+S([[134,160],[176,158]],T)+
    S([[206,146],[226,144]],T)+S([[228,120],[226,180]],T)+
    S([[132,190],[176,188]],T)+S([[144,190],[142,218]],T)+S([[166,188],[164,220]],T)+S([[134,220],[178,218]],T)+
    S([[210,180],[208,234]],T)
  , "0 0 260 240")});
}

// 6. 페인트통 사고
{
  const body=[[92,132],[148,134],[176,212],[64,214]];
  const chest=[[110,140],[132,140],[121,196]];
  cards.push({t:"⑥ 페인트통 사고 버전", d:"한쪽 귀는 안 칠했고, 얼굴 검정이 살짝 밖으로 샜고, 가슴 세모에 노란색이 튀었고, 구석에 파란 얼룩.",
  s:svg(
    `<polygon points="240,0 180,0 240,70" fill="${BLUE}"/>`+
    F(body,BROWN,-3,2)+S(body,{close:true,amp:2})+
    F(chest,YEL,6,4)+F(chest,WHITE,0,0)+S(chest,{close:true,w:2.5})+
    S([[100,214],[98,232]])+S([[144,214],[146,230]])+
    S([[176,196],[206,176],[214,190]],{amp:2.5})+
    F([[94,50],[68,-10],[116,40]],DARK,-8,6)+     // 샌 검정
    face(120,88,50,{earFill:"none"})+
    F([[90,50],[68,-12],[116,40]],DARK,1,2)+S([[90,50],[68,-12],[116,40]],{close:true})+   // 왼쪽 귀만 칠함
    `<circle cx="30" cy="210" r="9" fill="${RED}"/>`
  )});
}

document.getElementById('grid').innerHTML = cards.map(c=>`<div class="card"><h3>${c.t}</h3>${c.s}<p>${c.d}</p></div>`).join('');
</script>
</body>
</html>
